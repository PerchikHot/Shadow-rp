name: Shadow RP Windows AI Chat
on:
  push:
    branches: [main]
    paths:
      - 'desktop/rp_chat.py'
      - 'desktop/rp_context.py'
      - 'desktop/rp_transport.py'
      - 'desktop/test_rp_transport.py'
      - 'desktop/rp_backup.py'
      - 'desktop/rp_storage.py'
      - 'desktop/test_rp_storage.py'
      - 'desktop/test_rp_backup.py'
      - 'desktop/test_rp_context.py'
      - 'assets/launcher.webp'
      - 'tools/build_icons.py'
      - '.github/workflows/rp-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RP desktop client
        run: |
          python -m py_compile desktop/rp_chat.py desktop/rp_context.py desktop/rp_transport.py desktop/rp_backup.py desktop/rp_storage.py
          python -m unittest discover -s desktop -p "test_rp_*.py" -v
      - name: Generate and verify Windows EXE icon
        run: |
          python -m pip install pillow pyinstaller pefile
          python tools/build_icons.py
          python tools/build_icons.py --verify
      - name: Build Windows EXE with actual Veyrion icon
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/ShadowRP.ico --name ShadowRP desktop/rp_chat.py
      - name: Verify EXE icon resource
        run: |
          python -c "import pefile; p=pefile.PE(r'dist/ShadowRP.exe'); assert any(x.id==14 for x in p.DIRECTORY_ENTRY_RESOURCE.entries), 'No Windows group icon resource'"
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-Windows-AI-Chat
          path: dist/ShadowRP.exe
          if-no-files-found: error
      - name: Publish verified Windows AI chat for All Hub updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = 'dist/ShadowRP.exe'
          if (!(Test-Path $exe)) { throw 'Verified Windows EXE missing' }
          $version = (Select-String -Path 'app/build.gradle.kts' -Pattern 'versionName\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (!$version) { throw 'Android/Windows release version missing' }
          $tag = 'shadow-rp-windows'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title 'Shadow RP — Windows AI Chat' --notes "Version: $version" --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create Windows release' }
          }
          gh release upload $tag $exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload Windows EXE' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes "Shadow RP AI roleplay chat Windows EXE.`nVersion: $version"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot update Windows release version' }
