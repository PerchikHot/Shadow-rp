name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Build debug APK for testing
        run: /opt/gradle-8.9/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare permanent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADOWRP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shadowrp-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build permanently signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SHADOWRP_KEYSTORE_PATH: ${{ runner.temp }}/shadowrp-release.jks
          SHADOWRP_KEYSTORE_PASSWORD: ${{ secrets.SHADOWRP_KEYSTORE_PASSWORD }}
          SHADOWRP_KEY_ALIAS: ${{ secrets.SHADOWRP_KEY_ALIAS }}
          SHADOWRP_KEY_PASSWORD: ${{ secrets.SHADOWRP_KEY_PASSWORD }}
        run: /opt/gradle-8.9/bin/gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ShadowRP-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
