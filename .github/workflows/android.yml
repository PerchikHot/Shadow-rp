name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: shadow-rp-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Generate and verify real Veyrion Android launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/build_icons.py
          python3 tools/build_icons.py --verify
      - name: Test portable RP backups and build debug APK
        run: /opt/gradle-8.9/bin/gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Verify launcher icons are packaged into APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E "res/mipmap-[^/]+/ic_launcher[^/]*\.png" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare permanent signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADOWRP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shadowrp-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build permanently signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SHADOWRP_KEYSTORE_PATH: ${{ runner.temp }}/shadowrp-release.jks
          SHADOWRP_KEYSTORE_PASSWORD: ${{ secrets.SHADOWRP_KEYSTORE_PASSWORD }}
          SHADOWRP_KEY_ALIAS: ${{ secrets.SHADOWRP_KEY_ALIAS }}
          SHADOWRP_KEY_PASSWORD: ${{ secrets.SHADOWRP_KEY_PASSWORD }}
        run: /opt/gradle-8.9/bin/gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ShadowRP-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish signed APK to GitHub Releases
        # Never overwrite an installable signed release with a debug APK.
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/ShadowRP-Android.apk
          NOTES="Подписанная release-сборка Shadow RP."
          gh release view shadow-rp-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create shadow-rp-android --repo "$GITHUB_REPOSITORY" \
              --title "Shadow RP — Android" --notes "$NOTES" --latest=false
          gh release upload shadow-rp-android /tmp/ShadowRP-Android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          gh release edit shadow-rp-android --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf '%s\nVersion: %s\n' "$NOTES" "$VERSION")"
