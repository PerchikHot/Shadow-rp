name: Shadow RP Forge 1.20.1 JAR

on:
  push:
    branches: [main]
    paths:
      - 'forge/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge 1.20.1 mod
        run: gradle -p forge build --no-daemon --stacktrace
      - name: Verify JAR exists
        run: |
          test -s forge/build/libs/shadowrp-forge-1.20.1-0.1.0.jar
          unzip -l forge/build/libs/shadowrp-forge-1.20.1-0.1.0.jar | grep 'META-INF/mods.toml'
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-Forge-1.20.1-untested
          path: forge/build/libs/shadowrp-forge-1.20.1-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
