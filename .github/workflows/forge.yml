name: Shadow RP Forge 1.20.1 JAR

on:
  push:
    branches: [main]
    paths:
      - 'forge/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate quest and NPC translations
        run: python3 forge/tools/check_localizations.py
      - name: Compile Forge 1.20.1 mod
        run: gradle -p forge build --no-daemon --stacktrace
      - name: Verify JAR exists
        run: |
          jar=$(find forge/build/libs -maxdepth 1 -type f -name 'shadowrp-forge-1.20.1-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          test -s "$jar"
          unzip -l "$jar" | grep 'META-INF/mods.toml'
          echo "FORGE_JAR=$jar" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-Forge-1.20.1-untested
          path: ${{ env.FORGE_JAR }}
          if-no-files-found: error
          retention-days: 14
