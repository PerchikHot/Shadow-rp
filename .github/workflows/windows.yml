name: Shadow RP Windows Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only Forge instance inspection
        run: |
          python -m py_compile desktop/shadow_launcher.py
          python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Package companion EXE
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShadowRP-Companion desktop/shadow_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRP-Windows-companion-preview
          path: dist/ShadowRP-Companion.exe
          if-no-files-found: error
          retention-days: 14
